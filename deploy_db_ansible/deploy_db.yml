---
- name: "CliXX DB Deployment Ansible Playbook"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    instance_id: wordpressdbclixx-ecs
    db_snapshot: wordpressdbclixx-ecs
    security_group: sg-01748ba90a79e3679

  tasks:
    - name: Restore DB from snapshot
      amazon.aws.rds_instance:
        db_instance_identifier: "{{ instance_id }}"
        db_snapshot_identifier: "{{ db_snapshot }}"
        creation_source: snapshot
        region: us-east-1
        db_instance_class: db.m7g.large
        vpc_security_group_ids:
          - "{{ security_group }}"
        state: present
        wait: true

    - name: Display restored RDS endpoint
      amazon.aws.rds_instance_info:
        db_instance_identifier: "{{ instance_id }}"
        region: us-east-1
      register: rds_info

    - name: Show RDS endpoint
      ansible.builtin.debug:
        msg: "{{ rds_info.instances[0].endpoint.address }}"